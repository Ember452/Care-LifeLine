services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: care
      POSTGRES_PASSWORD: care
      POSTGRES_DB: care
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U care"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      CARE_DATABASE_URL: postgresql+psycopg://care:care@postgres:5432/care
      CARE_QDRANT_URL: http://qdrant:6333
      CARE_JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me-please-rotate-in-prod}
      LLM_MODE: mock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command: >
      sh -c "uv run python -m care_lifeline.db.seed_demo &&
             uv run uvicorn care_lifeline.api.app:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
  qdrantdata:
