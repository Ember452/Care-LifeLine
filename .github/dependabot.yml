version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      langchain:
        patterns: ["langchain*", "langgraph*"]
      dev-tools:
        patterns: ["pytest*", "ruff", "mypy", "pre-commit"]
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
