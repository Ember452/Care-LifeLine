name: Eval Regression

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  eval:
    name: Medical Evals
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'eval')
    runs-on: ubuntu-latest
    env:
      # 评测仅跑确定性/规则类指标时无需真实 LLM Key；需要 LLM 指标时从 Secrets 注入
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Run eval suite
        run: uv run pytest tests/eval -q --eval-report --eval-report-path eval-report.md

      - name: Upload eval report
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: eval-report.md

      - name: Comment eval summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('eval-report.md')
              ? fs.readFileSync('eval-report.md', 'utf8').slice(0, 60000)
              : 'eval report not generated';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 评测报告\n\`\`\`markdown\n${report}\n\`\`\``
            });
