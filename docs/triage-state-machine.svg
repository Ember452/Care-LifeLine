<svg viewBox="0 0 680 460" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>医疗分诊状态机流程</title>
<desc>导诊采集后经风险分级，按低危、中危、高危三条分支流转，专科问诊后进入质控与合规</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="28" font-size="15" font-weight="500" fill="#1f2328">医疗分诊 · 状态机流程</text>
<text x="40" y="50" font-size="12" fill="#57606a">条件路由 + 确定性规则兜底，是架构的一等公民（运行于 LangGraph 之上的自研规则 / 路由层）</text>
<rect x="40" y="80" width="160" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-opacity="0.6" stroke-width="0.5"/>
<text x="120" y="98" font-size="13" font-weight="500" fill="#B5D4F4" text-anchor="middle" dominant-baseline="central">导诊采集</text>
<text x="120" y="118" font-size="12" fill="#E6F1FB" text-anchor="middle" dominant-baseline="central">多轮追问主诉/病史/过敏史</text>
<line x1="204" y1="108" x2="252" y2="108" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="260" y="80" width="160" height="56" rx="8" fill="#633806" stroke="#EF9F27" stroke-opacity="0.6" stroke-width="0.5"/>
<text x="340" y="98" font-size="13" font-weight="500" fill="#FAC775" text-anchor="middle" dominant-baseline="central">风险分级 / 路由</text>
<text x="340" y="118" font-size="12" fill="#FAEEDA" text-anchor="middle" dominant-baseline="central">规则引擎 · 确定性判断</text>
<line x1="340" y1="138" x2="340" y2="166" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 168 C 240 190, 170 190, 117 208" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="160" y="184" font-size="12" fill="#57606a">低危</text>
<line x1="340" y1="168" x2="340" y2="204" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="350" y="188" font-size="12" fill="#57606a">中危</text>
<path d="M340 168 C 440 190, 510 190, 563 208" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="490" y="184" font-size="12" fill="#57606a">高危</text>
<rect x="40" y="210" width="150" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="0.5"/>
<text x="115" y="228" font-size="13" font-weight="500" fill="#1f2328" text-anchor="middle" dominant-baseline="central">低危 · 健康建议</text>
<text x="115" y="248" font-size="12" fill="#57606a" text-anchor="middle" dominant-baseline="central">知识库回答 + 免责</text>
<text x="115" y="290" font-size="12" fill="#57606a" text-anchor="middle">全程写入审计日志</text>
<rect x="265" y="210" width="150" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-opacity="0.6" stroke-width="0.5"/>
<text x="340" y="228" font-size="13" font-weight="500" fill="#B5D4F4" text-anchor="middle" dominant-baseline="central">专科问诊</text>
<text x="340" y="248" font-size="12" fill="#E6F1FB" text-anchor="middle" dominant-baseline="central">专科 Agent + 知识库</text>
<rect x="490" y="210" width="150" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="0.5"/>
<text x="565" y="228" font-size="13" font-weight="500" fill="#1f2328" text-anchor="middle" dominant-baseline="central">高危 · 转人工</text>
<text x="565" y="248" font-size="12" fill="#57606a" text-anchor="middle" dominant-baseline="central">建议就医 / 挂急诊</text>
<text x="565" y="290" font-size="12" fill="#57606a" text-anchor="middle">全程留痕 · 可转专科</text>
<line x1="340" y1="268" x2="340" y2="332" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="265" y="340" width="150" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-opacity="0.6" stroke-width="0.5"/>
<text x="340" y="358" font-size="13" font-weight="500" fill="#B5D4F4" text-anchor="middle" dominant-baseline="central">质控审核</text>
<text x="340" y="378" font-size="12" fill="#E6F1FB" text-anchor="middle" dominant-baseline="central">DDI · 禁忌 · 越界拦截</text>
<line x1="417" y1="368" x2="482" y2="368" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="490" y="340" width="150" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-opacity="0.6" stroke-width="0.5"/>
<text x="565" y="358" font-size="13" font-weight="500" fill="#B5D4F4" text-anchor="middle" dominant-baseline="central">合规输出</text>
<text x="565" y="378" font-size="12" fill="#E6F1FB" text-anchor="middle" dominant-baseline="central">脱敏 · 免责 · 审计日志</text>
<text x="40" y="445" font-size="11" fill="#57606a">注：高危分支同样全程留痕、可转专科；主动式慢病管理 / 多模态药盒识别 / 数据闭环为平台其他子系统。</text>
</svg>
