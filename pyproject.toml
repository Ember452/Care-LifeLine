[project]
name = "care-lifeline"
version = "0.2.0"
description = "Enterprise medical agent platform (multi-agent + quality control + data flywheel)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.1",
    "psycopg[binary]>=3.2",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "python-multipart",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/care_lifeline"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
# 覆盖率门禁：质控规则模块必须 100%
[tool.coverage.run]
source = ["src/care_lifeline"]
omit = ["src/care_lifeline/api/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = ["if TYPE_CHECKING:", "pragma: no cover"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]  # B008=FastAPI Depends；RUF=中文全角标点是有意使用

[tool.mypy]
python_version = "3.13"
packages = ["src/care_lifeline"]
explicit_package_bases = true
mypy_path = "src"
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false  # 渐进式：核心模块（safety/qc）要求全量标注，其余逐步收紧
